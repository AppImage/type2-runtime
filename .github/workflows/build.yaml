name: build

on:
  push:
    # branches:
    # - 'main'
    # NOTE: pull_request tests a potential merge conflict. push builds the branch as it would build main. Both serve separate purposes.
    # Especially when working with CI changes, we may want to see both, hence not limiting builds to the main branch.
  pull_request:
  workflow_dispatch:

# This ensures that jobs get canceled when force-pushing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default Debian shell (dash) is faster than bash at running scripts,
# and using bash when it is not needed doesn't make sense.
defaults:
  run:
    shell: sh

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - appimage_arch: i686
          runner: ubuntu-24.04
        - appimage_arch: x86_64
          runner: ubuntu-24.04
        - appimage_arch: armhf
          runner: ubuntu-24.04-arm
        - appimage_arch: aarch64
          runner: ubuntu-24.04-arm
        - appimage_arch: riscv64
          runner: ubuntu-24.04
          qemu: true
        - appimage_arch: ppc64le
          runner: ubuntu-24.04
          qemu: true

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # GitHub has no RISC-V and POWER runners: the build container runs emulated
    - name: Set up QEMU
      if: ${{ matrix.qemu }}
      uses: docker/setup-qemu-action@v4

    - name: Get git hash
      run: |
           echo -n "https://github.com/${GITHUB_REPOSITORY}/commit/" > src/runtime/version
           git rev-parse --short HEAD  | xargs >> src/runtime/version

    - name: Build
      env:
        ARCH: ${{ matrix.appimage_arch }}
      run: |
          # make sure to collect artifacts in a separate directory
          # makes uploading easier
          mkdir -p out
          (cd out && ../scripts/docker/build-with-docker.sh)

    - name: Sign
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      # skip signing if secret is not available (e.g., if run from a PR made by somebody outside of this repository)
      if: ${{ env.SIGNING_KEY != '' }}
      run: |
        find out
        scripts/sign.sh out/runtime-*
        # copy pubkey so that it's included with the files uploaded to the release page
        cp signing-pubkey.asc out/

    - uses: actions/upload-artifact@v7
      with:
        name: artifacts ${{ matrix.appimage_arch }}
        path: out/*

  build-in-chroot:
    strategy:
      fail-fast: false
      matrix:
        include:
        - alpine_arch: x86
          runner: ubuntu-24.04
        - alpine_arch: x86_64
          runner: ubuntu-24.04
        - alpine_arch: armhf
          runner: ubuntu-24.04-arm
        - alpine_arch: aarch64
          runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Get git hash
      run: |
           echo -n "https://github.com/${GITHUB_REPOSITORY}/commit/" > src/runtime/version
           git rev-parse --short HEAD  | xargs >> src/runtime/version

    - name: Build in chroot
      env:
        ALPINE_ARCH: ${{ matrix.alpine_arch }}
      run: |
        scripts/chroot/chroot_build.sh

  # Architectures without Alpine Linux (big endian ppc64): built in Debian ports
  # with glibc (scripts/debian-ports/build-in-debian.sh), emulated by QEMU
  build-debian-ports:
    strategy:
      fail-fast: false
      matrix:
        include:
        - appimage_arch: ppc64
          debian_arch: ppc64
          platform: linux/ppc64

    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Get git hash
      run: |
           echo -n "https://github.com/${GITHUB_REPOSITORY}/commit/" > src/runtime/version
           git rev-parse --short HEAD  | xargs >> src/runtime/version

    # debian-ports has no Docker images: the root file system is made with
    # debootstrap (its second stage runs emulated) and imported. The binfmt
    # image of setup-qemu-action has no big endian ppc64: qemu-user-static of Ubuntu
    - name: Make the Debian ports image
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static
        # the keyring of Ubuntu is older than the key that signs sid today
        KEYRING=debian-ports-archive-keyring_2026.02.04_all.deb
        curl -fsSLO https://deb.debian.org/debian/pool/main/d/debian-ports-archive-keyring/$KEYRING
        dpkg-deb -x $KEYRING keyring
        # the keyring goes into the system too, for its apt-get update
        sudo debootstrap --arch=${{ matrix.debian_arch }} --variant=minbase \
          --include=debian-ports-archive-keyring \
          --keyring=$PWD/keyring/usr/share/keyrings/debian-ports-archive-keyring.gpg \
          sid rootfs http://ftp.ports.debian.org/debian-ports
        sudo tar -C rootfs -c . | docker import --platform ${{ matrix.platform }} - debian-ports
        sudo rm -rf rootfs keyring $KEYRING

    - name: Build
      run: |
        docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src debian-ports \
          bash scripts/debian-ports/build-in-debian.sh
        sudo chown -R "$(id -u):$(id -g)" out

    - uses: actions/upload-artifact@v7
      with:
        name: artifacts ${{ matrix.appimage_arch }}
        path: out/*

  upload:
    name: Create release and upload artifacts
    runs-on: ubuntu-latest
    needs:
      - build
      - build-debian-ports
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Inspect directory after downloading artifacts
        run: ls -alFR
      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
            chmod +x pyuploadtool-x86_64.AppImage
            GITHUB_CONTINUOUS_RELEASE_TYPE=stable ./pyuploadtool-x86_64.AppImage --appimage-extract-and-run artifacts*/*
